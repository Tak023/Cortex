<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jarvis — Neural Core</title>
<!--
  Jarvis avatar visualization. Embedded by src/components/jarvis/JarvisAvatar.tsx
  as an iframe with ?embed=1&state=<mood>, and driven thereafter by
  postMessage({type:'jarvis-state', state}).

  States: idle | listening | processing | speaking | offline
  The previous flat-ring HUD is in git history (public/jarvis.html before this).
-->
<style>
  :root { --cy:#38e8ff; --az:#4f8bff; --vi:#9b7dff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#04070e; }
  body {
    display:flex; align-items:center; justify-content:center;
    font-family:ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, #0a1c33 0%, #050b16 55%, #04070e 100%);
  }
  #c { display:block; width:100%; height:100%; }
  .label {
    position:absolute; bottom:6%; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(190,225,255,.5); transition:color .6s ease; white-space:nowrap;
  }
  body.state-listening .label { color:#7fe3ff; }
  body.state-speaking  .label { color:#a9c6ff; }
  body.state-processing .label { color:#c3a9ff; }
  body.state-offline   .label { color:rgba(160,180,200,.28); }

  /* Wordmark only when opened directly — hidden inside the app's iframe. */
  .titles { position:absolute; top:7%; left:50%; transform:translateX(-50%); text-align:center; }
  body.embed .titles { display:none; }
  .titles .t {
    font-size:20px; font-weight:300; letter-spacing:.42em;
    color:rgba(190,232,255,.92); text-shadow:0 0 22px rgba(56,232,255,.35);
  }
  .titles .s {
    margin-top:7px; font-size:9px; letter-spacing:.28em;
    color:rgba(150,185,215,.42);
  }
</style>
</head>
<body class="state-idle">
<canvas id="c"></canvas>
<div class="titles">
  <div class="t">J.A.R.V.I.S.</div>
  <div class="s">JUST · A · RATHER · VERY · INTELLIGENT · SYSTEM</div>
</div>
<div class="label" id="label">Ready</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const labelEl = document.getElementById('label');
  const LABELS = { idle:'Ready', listening:'Listening', processing:'Thinking',
                   speaking:'Speaking', offline:'Offline' };
  // Read once: setState rewrites body.className, so the embed flag must persist.
  const EMBED = new URLSearchParams(location.search).get('embed') === '1';

  let W=0, H=0, DPR=1, cx=0, cy=0, R=0;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    // Budget: outermost element (arcs at 2.15) must stay inside 0.46 of the frame
    cx = W/2; cy = H/2; R = Math.min(W,H)*0.205;
  }
  window.addEventListener('resize', resize);

  // ── state ────────────────────────────────────────────────────────────────
  let state = 'idle';
  const P = { // eased toward TARGET[state] every frame
    spin:0.10, breathe:1, glow:1, converge:0, amp:0, hue:0
  };
  const TARGET = {
    idle:       { spin:0.10, breathe:1.00, glow:1.00, converge:0.00, hue:0.00 },
    listening:  { spin:0.16, breathe:1.05, glow:1.35, converge:0.55, hue:0.10 },
    processing: { spin:0.62, breathe:0.97, glow:1.20, converge:0.15, hue:0.60 },
    speaking:   { spin:0.22, breathe:1.08, glow:1.55, converge:0.00, hue:0.28 },
    offline:    { spin:0.02, breathe:0.94, glow:0.22, converge:0.00, hue:0.00 },
  };
  let primed = false;
  function setState(s){
    if(!TARGET[s]) return;
    state = s;
    document.body.className = (EMBED ? 'embed ' : '') + 'state-' + s;
    labelEl.textContent = LABELS[s];
    // First state comes from the URL — start there rather than easing up from idle
    if(!primed){ Object.assign(P, TARGET[s]); primed = true; }
  }

  // ── particle shell: points on a sphere, rotated and projected ────────────
  const N = 260;
  const pts = [];
  for(let i=0;i<N;i++){
    // fibonacci sphere → even distribution
    const k = i + 0.5;
    const phi = Math.acos(1 - 2*k/N);
    const theta = Math.PI * (1 + Math.sqrt(5)) * k;
    pts.push({
      x: Math.sin(phi)*Math.cos(theta),
      y: Math.sin(phi)*Math.sin(theta),
      z: Math.cos(phi),
      seed: Math.random()*Math.PI*2,
      sp: 0.6 + Math.random()*0.8,
      // varied mass so the shell reads as depth, not a uniform dot screen
      m: 0.45 + Math.pow(Math.random(), 2.2)*1.5,
    });
  }

  const lerp = (a,b,t) => a + (b-a)*t;
  function mixHue(t){
    // cyan → azure → violet
    const stops = [[56,232,255],[79,139,255],[155,125,255]];
    const p = Math.max(0,Math.min(1,t))*(stops.length-1);
    const i = Math.floor(p), f = p-i;
    const a = stops[i], b = stops[Math.min(i+1,stops.length-1)];
    return [Math.round(lerp(a[0],b[0],f)), Math.round(lerp(a[1],b[1],f)), Math.round(lerp(a[2],b[2],f))];
  }

  let t = 0, rot = 0;
  function frame(){
    t += 1/60;
    const tg = TARGET[state];
    for(const k of ['spin','breathe','glow','converge','hue']) P[k] = lerp(P[k], tg[k], 0.05);
    // speech amplitude: layered sines → organic, non-repeating feel
    const speaking = state === 'speaking';
    const listening = state === 'listening';
    const rawAmp = speaking
      ? (Math.sin(t*7.1)*0.5 + Math.sin(t*11.3)*0.3 + Math.sin(t*17.7)*0.2)
      : listening ? Math.sin(t*2.2)*0.35 : 0;
    P.amp = lerp(P.amp, Math.abs(rawAmp), 0.25);

    rot += P.spin/60 * Math.PI*2;

    ctx.clearRect(0,0,W,H);
    const [cr,cg,cb] = mixHue(P.hue);
    const breathe = P.breathe + Math.sin(t*0.9)*0.02 + P.amp*0.10;
    const r = R*breathe;

    // ── outer atmospheric bloom ───────────────────────────────────────────
    const bloom = ctx.createRadialGradient(cx,cy,0,cx,cy,r*3.1);
    bloom.addColorStop(0,   `rgba(${cr},${cg},${cb},${0.20*P.glow})`);
    bloom.addColorStop(0.35,`rgba(${cr},${cg},${cb},${0.07*P.glow})`);
    bloom.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0,0,W,H);

    // ── volumetric core sphere: dark limb + hot nucleus (fresnel feel) ─────
    const core = ctx.createRadialGradient(cx - r*0.18, cy - r*0.22, r*0.02, cx, cy, r*0.92);
    core.addColorStop(0,    `rgba(255,255,255,${0.95*P.glow})`);
    core.addColorStop(0.14, `rgba(${Math.min(255,cr+70)},${Math.min(255,cg+40)},255,${0.85*P.glow})`);
    core.addColorStop(0.42, `rgba(${cr},${cg},${cb},${0.42*P.glow})`);
    core.addColorStop(0.80, `rgba(${Math.round(cr*0.35)},${Math.round(cg*0.45)},${Math.round(cb*0.7)},${0.20*P.glow})`);
    core.addColorStop(1,    'rgba(4,7,14,0)');
    ctx.beginPath(); ctx.arc(cx,cy,r*0.92,0,Math.PI*2);
    ctx.fillStyle = core; ctx.fill();

    // fresnel rim — bright edge, reads as a lit sphere not a flat disc
    ctx.beginPath(); ctx.arc(cx,cy,r*0.9,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${Math.min(255,cr+50)},${Math.min(255,cg+50)},255,${0.30*P.glow})`;
    ctx.lineWidth = Math.max(1, r*0.012); ctx.stroke();

    // ── neural shell: particles + proximity links ─────────────────────────
    const proj = [];
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    const tiltC = Math.cos(0.42), tiltS = Math.sin(0.42);
    for(const p of pts){
      // rotate around Y, then tilt around X
      let x = p.x*cosR - p.z*sinR;
      let z = p.x*sinR + p.z*cosR;
      let y = p.y*tiltC - z*tiltS;
      z     = p.y*tiltS + z*tiltC;
      // radius: converge inward when listening, jitter with speech
      const wobble = 1 + Math.sin(t*p.sp + p.seed)*0.045;
      const shell = (1.34 - P.converge*0.30) * wobble + P.amp*0.13;
      const depth = (z+1)/2;                        // 0 back → 1 front
      proj.push({
        sx: cx + x*r*shell,
        sy: cy + y*r*shell,
        d: depth,
        s: (0.5 + depth*1.5) * (r*0.016) * p.m,
      });
    }
    proj.sort((a,b)=>a.d-b.d);                       // painter's order

    // links between nearby front-ish points → constellation / synapse read
    const LINK = r*0.42;
    ctx.lineWidth = Math.max(0.6, r*0.006);
    for(let i=0;i<proj.length;i++){
      const a = proj[i]; if(a.d < 0.34) continue;
      for(let j=i+1;j<Math.min(i+14,proj.length);j++){
        const b = proj[j];
        const dx = a.sx-b.sx, dy = a.sy-b.sy;
        const dist = Math.hypot(dx,dy);
        if(dist < LINK){
          const o = (1 - dist/LINK) * 0.55 * a.d * P.glow;
          ctx.strokeStyle = `rgba(${cr},${cg},${cb},${o})`;
          ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
        }
      }
    }
    for(const p of proj){
      const o = (0.18 + p.d*0.72) * P.glow;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,p.s,0,Math.PI*2);
      ctx.fillStyle = `rgba(${Math.min(255,cr+40)},${Math.min(255,cg+30)},255,${o})`;
      ctx.fill();
    }

    // ── thin orbital arcs — a whisper of the old HUD, modernised ──────────
    const arcs = [
      { rad:1.70, from:rot*0.7,      len:1.5, w:0.020, a:0.38 },
      { rad:1.93, from:-rot*0.45+2.0,len:0.9, w:0.013, a:0.26 },
      { rad:2.15, from:rot*0.28+4.1, len:2.3, w:0.009, a:0.17 },
    ];
    for(const A of arcs){
      ctx.beginPath();
      ctx.arc(cx,cy,r*A.rad,A.from,A.from+A.len);
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${A.a*P.glow})`;
      ctx.lineWidth = Math.max(1, r*A.w);
      ctx.lineCap = 'round'; ctx.stroke();
    }

    // ── voice ring: amplitude bars only when there is something to say ────
    if(P.amp > 0.02){
      const BARS = 96, ringR = r*1.16;
      for(let i=0;i<BARS;i++){
        const ang = (i/BARS)*Math.PI*2 - Math.PI/2;
        const n = Math.sin(i*0.7 + t*6.5) * Math.sin(i*0.23 + t*3.1);
        const h = r*0.10 * P.amp * (0.35 + Math.abs(n));
        const x1 = cx + Math.cos(ang)*ringR,      y1 = cy + Math.sin(ang)*ringR;
        const x2 = cx + Math.cos(ang)*(ringR+h),  y2 = cy + Math.sin(ang)*(ringR+h);
        ctx.strokeStyle = `rgba(${Math.min(255,cr+30)},${cg},255,${0.5*P.amp+0.15})`;
        ctx.lineWidth = Math.max(1, r*0.010); ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      }
    }

    // ── processing sweep: a single confident arc, not a radar sweep ───────
    if(state === 'processing'){
      const a0 = rot*2.2;
      const g = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
      g.addColorStop(0,`rgba(${cr},${cg},${cb},0)`);
      g.addColorStop(1,`rgba(200,180,255,.9)`);
      ctx.beginPath(); ctx.arc(cx,cy,r*1.34,a0,a0+1.1);
      ctx.strokeStyle = g; ctx.lineWidth = Math.max(2, r*0.028); ctx.lineCap='round'; ctx.stroke();
    }

    requestAnimationFrame(frame);
  }

  // ── host contract: identical to the current jarvis.html ─────────────────
  const qs = new URLSearchParams(location.search);
  resize();
  setState(qs.get('state') || 'idle');
  window.addEventListener('message', (e) => {
    const d = e.data;
    if(d && d.type === 'jarvis-state' && typeof d.state === 'string') setState(d.state);
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
