<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S. Interface</title>
<style>
  :root {
    --jarvis-cyan: #4dd8ff;
    --jarvis-blue: #0a84ff;
    --jarvis-deep: #002a4a;
    --jarvis-glow: #7ee8ff;
    --jarvis-bg: #000814;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
  }
  body {
    background: radial-gradient(ellipse at center, #001529 0%, #000208 70%, #000 100%);
    min-height: 100vh;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: var(--jarvis-cyan);
    overflow: hidden;
    padding: 40px 20px;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(77, 216, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 216, 255, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    animation: gridPulse 8s ease-in-out infinite;
  }
  @keyframes gridPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    z-index: 1;
  }
  .jarvis-core {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring { fill: none; stroke: var(--jarvis-cyan); stroke-linecap: round; transform-origin: center; }
  .center-glow {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--jarvis-glow) 0%, var(--jarvis-cyan) 30%, transparent 70%);
    filter: blur(8px);
    animation: corePulse 2.4s ease-in-out infinite;
  }
  .core-nucleus {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--jarvis-glow) 50%, var(--jarvis-cyan) 100%);
    box-shadow:
      0 0 20px var(--jarvis-glow),
      0 0 40px var(--jarvis-cyan),
      0 0 80px var(--jarvis-blue);
    animation: nucleusPulse 2.4s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  @keyframes nucleusPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.4); }
  }
  .rot-cw { animation: rotate 20s linear infinite; }
  .rot-ccw { animation: rotate-r 30s linear infinite; }
  .rot-cw-fast { animation: rotate 8s linear infinite; }
  .rot-ccw-fast { animation: rotate-r 12s linear infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes rotate-r { to { transform: rotate(-360deg); } }
  .arc-segment {
    stroke-dasharray: 80 400;
    animation: dashShift 4s linear infinite;
  }
  @keyframes dashShift {
    to { stroke-dashoffset: -480; }
  }
  .tick { stroke: var(--jarvis-cyan); stroke-width: 1; opacity: 0.7; }
  .tick-bright { stroke: var(--jarvis-glow); stroke-width: 2; opacity: 1; }
  .hex-marker { fill: var(--jarvis-cyan); opacity: 0.8; }
  .scan-line {
    stroke: var(--jarvis-glow);
    stroke-width: 1.5;
    opacity: 0.9;
    filter: drop-shadow(0 0 4px var(--jarvis-glow));
  }
  .label {
    font-size: 8px;
    fill: var(--jarvis-cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }
  .label-bright { fill: var(--jarvis-glow); font-weight: bold; }

  /* Interaction states */
  .jarvis-core.state-listening .ring.pulse-listen { animation: listenPulse 1.2s ease-in-out infinite; }
  .jarvis-core.state-speaking .core-nucleus { animation: speakPulse 0.4s ease-in-out infinite; }
  .jarvis-core.state-processing .rot-cw { animation-duration: 4s; }
  .jarvis-core.state-processing .rot-ccw { animation-duration: 5s; }
  .jarvis-core.state-processing .rot-cw-fast { animation-duration: 2s; }
  @keyframes listenPulse {
    0%, 100% { stroke-width: 1; opacity: 0.6; }
    50% { stroke-width: 3; opacity: 1; }
  }
  @keyframes speakPulse {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(0.9); }
    75% { transform: scale(1.2); }
  }

  /* Waveform */
  .waveform {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: center;
    height: 60px;
    padding: 12px 24px;
    background: rgba(0, 42, 74, 0.3);
    border: 1px solid rgba(77, 216, 255, 0.3);
    border-radius: 4px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 30px rgba(77, 216, 255, 0.15) inset;
  }
  .wave-bar {
    width: 3px;
    background: linear-gradient(to top, var(--jarvis-blue), var(--jarvis-glow));
    border-radius: 2px;
    animation: waveBar 1.2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--jarvis-cyan);
  }
  @keyframes waveBar {
    0%, 100% { height: 6px; opacity: 0.5; }
    50% { height: 40px; opacity: 1; }
  }

  /* HUD text panels */
  .hud-panels {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 20px;
    align-items: center;
    width: 100%;
    max-width: 720px;
    margin-top: 10px;
  }
  .hud-panel {
    padding: 10px 16px;
    border: 1px solid rgba(77, 216, 255, 0.3);
    background: linear-gradient(135deg, rgba(0, 42, 74, 0.4), rgba(0, 20, 40, 0.2));
    backdrop-filter: blur(4px);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    color: var(--jarvis-cyan);
    text-shadow: 0 0 8px var(--jarvis-cyan);
  }
  .hud-panel .val { color: var(--jarvis-glow); font-weight: bold; }
  .status-badge {
    padding: 8px 20px;
    border: 1px solid var(--jarvis-glow);
    color: var(--jarvis-glow);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(126, 232, 255, 0.08);
    text-shadow: 0 0 10px var(--jarvis-glow);
    box-shadow:
      0 0 20px rgba(126, 232, 255, 0.3),
      inset 0 0 20px rgba(126, 232, 255, 0.1);
    animation: statusBlink 2s ease-in-out infinite;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .title {
    font-size: 42px;
    letter-spacing: 12px;
    color: var(--jarvis-glow);
    text-shadow:
      0 0 10px var(--jarvis-cyan),
      0 0 20px var(--jarvis-cyan),
      0 0 40px var(--jarvis-blue);
    font-weight: 300;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 10px;
    letter-spacing: 6px;
    color: rgba(77, 216, 255, 0.7);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--jarvis-cyan);
    color: var(--jarvis-cyan);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  .ctrl-btn:hover {
    background: rgba(77, 216, 255, 0.15);
    color: var(--jarvis-glow);
    box-shadow: 0 0 20px rgba(77, 216, 255, 0.4);
  }
  .ctrl-btn.active {
    background: rgba(126, 232, 255, 0.2);
    color: var(--jarvis-glow);
    border-color: var(--jarvis-glow);
    box-shadow: 0 0 20px var(--jarvis-cyan);
  }

  /* Particle/spark effects */
  .spark {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--jarvis-glow);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--jarvis-glow);
    animation: sparkFly 3s linear infinite;
  }
  @keyframes sparkFly {
    0% { opacity: 0; transform: translate(0, 0) scale(0); }
    20% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* Offline dampens the core */
  .jarvis-core.state-offline {
    filter: grayscale(0.55) brightness(0.55);
    opacity: 0.75;
  }
  .jarvis-core.state-offline .core-nucleus,
  .jarvis-core.state-offline .center-glow {
    animation: none;
  }

  /* Embed mode: core-focused layout for parent app iframe */
  body.embed {
    padding: 8px;
    justify-content: center;
  }
  body.embed .title,
  body.embed .subtitle,
  body.embed .controls,
  body.embed .hud-panels {
    display: none !important;
  }
  body.embed .stage {
    gap: 12px;
    width: 100%;
    height: 100%;
    justify-content: center;
  }
  body.embed .jarvis-core {
    width: min(78vmin, 420px);
    height: min(78vmin, 420px);
  }
  body.embed .waveform {
    height: 44px;
    padding: 8px 16px;
    max-width: min(90%, 360px);
  }
  body.embed .waveform .wave-bar {
    animation-play-state: paused;
    height: 6px;
    opacity: 0.35;
  }
  body.embed.state-listening .waveform .wave-bar,
  body.embed.state-speaking .waveform .wave-bar {
    animation-play-state: running;
    opacity: 1;
  }
  body.embed.state-processing .waveform .wave-bar {
    animation-play-state: running;
    animation-duration: 0.55s;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="stage">
    <div class="title">J.A.R.V.I.S.</div>
    <div class="subtitle">JUST · A · RATHER · VERY · INTELLIGENT · SYSTEM</div>

    <div class="jarvis-core state-idle" id="jarvis">
      <div class="center-glow"></div>
      <div class="core-nucleus"></div>

      <svg viewBox="0 0 420 420">
        <defs>
          <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7ee8ff" stop-opacity="0"/>
            <stop offset="80%" stop-color="#4dd8ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#0a84ff" stop-opacity="1"/>
          </radialGradient>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Outermost slow ring with tick marks -->
        <g class="rot-cw" filter="url(#softGlow)">
          <circle class="ring" cx="210" cy="210" r="200" stroke-width="1" opacity="0.5"/>
          <!-- Tick marks around outer ring -->
          <g id="outerTicks"></g>
        </g>

        <!-- Second ring: dashed segmented -->
        <g class="rot-ccw" filter="url(#softGlow)">
          <circle class="ring arc-segment" cx="210" cy="210" r="180" stroke-width="1.5"/>
          <circle class="ring arc-segment" cx="210" cy="210" r="180" stroke-width="1.5"
                  transform="rotate(120 210 210)"/>
          <circle class="ring arc-segment" cx="210" cy="210" r="180" stroke-width="1.5"
                  transform="rotate(240 210 210)"/>
        </g>

        <!-- Third ring: hex markers -->
        <g class="rot-cw-fast" filter="url(#softGlow)">
          <circle class="ring pulse-listen" cx="210" cy="210" r="155" stroke-width="1" opacity="0.7"/>
          <g id="hexMarkers"></g>
        </g>

        <!-- Fourth ring: label ring -->
        <g class="rot-ccw" filter="url(#softGlow)">
          <circle class="ring" cx="210" cy="210" r="135" stroke-width="0.5" opacity="0.5"/>
          <g id="labelRing"></g>
        </g>

        <!-- Fifth: bracket accents (4 corners) -->
        <g class="rot-cw-fast" filter="url(#strongGlow)">
          <path d="M 210,95 A 115,115 0 0,1 325,210" class="ring" stroke-width="2" opacity="0.9"/>
          <path d="M 210,325 A 115,115 0 0,1 95,210" class="ring" stroke-width="2" opacity="0.9"/>
        </g>

        <!-- Inner ring pulse -->
        <g filter="url(#strongGlow)">
          <circle class="ring pulse-listen" cx="210" cy="210" r="95" stroke-width="1.5" opacity="0.8"/>
          <circle class="ring" cx="210" cy="210" r="85" stroke-width="0.5" opacity="0.4"/>
        </g>

        <!-- Innermost triangular reticle -->
        <g class="rot-ccw-fast" filter="url(#strongGlow)">
          <polygon points="210,150 262,240 158,240" class="ring" stroke-width="1" opacity="0.7" fill="none"/>
          <polygon points="210,270 158,180 262,180" class="ring" stroke-width="1" opacity="0.7" fill="none"/>
        </g>

        <!-- Scan line sweep -->
        <g class="rot-cw" style="animation-duration: 4s;">
          <line x1="210" y1="210" x2="210" y2="30" class="scan-line"/>
          <circle cx="210" cy="30" r="3" fill="#7ee8ff" filter="url(#strongGlow)"/>
        </g>

        <!-- Crosshairs -->
        <line x1="30" y1="210" x2="80" y2="210" class="tick-bright"/>
        <line x1="340" y1="210" x2="390" y2="210" class="tick-bright"/>
        <line x1="210" y1="30" x2="210" y2="80" class="tick-bright"/>
        <line x1="210" y1="340" x2="210" y2="390" class="tick-bright"/>
      </svg>

      <!-- Spark particles -->
      <div id="sparks"></div>
    </div>

    <div class="waveform" id="waveform"></div>

    <div class="hud-panels">
      <div class="hud-panel">CPU · <span class="val">42%</span></div>
      <div class="status-badge" id="statusBadge">◉ ONLINE</div>
      <div class="hud-panel" style="text-align:right;">SYS · <span class="val">NOMINAL</span></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn active" data-state="idle">Idle</button>
      <button class="ctrl-btn" data-state="listening">Listening</button>
      <button class="ctrl-btn" data-state="speaking">Speaking</button>
      <button class="ctrl-btn" data-state="processing">Processing</button>
    </div>
  </div>

<script>
  // Generate outer ring tick marks
  const outerTicks = document.getElementById('outerTicks');
  for (let i = 0; i < 72; i++) {
    const angle = (i * 5) * Math.PI / 180;
    const len = i % 6 === 0 ? 12 : (i % 3 === 0 ? 6 : 3);
    const bright = i % 6 === 0;
    const x1 = 210 + Math.cos(angle) * 200;
    const y1 = 210 + Math.sin(angle) * 200;
    const x2 = 210 + Math.cos(angle) * (200 - len);
    const y2 = 210 + Math.sin(angle) * (200 - len);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', bright ? 'tick-bright' : 'tick');
    outerTicks.appendChild(line);
  }

  // Generate hex markers on third ring
  const hexMarkers = document.getElementById('hexMarkers');
  for (let i = 0; i < 12; i++) {
    const angle = (i * 30) * Math.PI / 180;
    const cx = 210 + Math.cos(angle) * 155;
    const cy = 210 + Math.sin(angle) * 155;
    const hex = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    const points = [];
    for (let j = 0; j < 6; j++) {
      const a = (j * 60 + 30) * Math.PI / 180;
      points.push(`${cx + Math.cos(a) * 4},${cy + Math.sin(a) * 4}`);
    }
    hex.setAttribute('points', points.join(' '));
    hex.setAttribute('class', 'hex-marker');
    hexMarkers.appendChild(hex);
  }

  // Generate label ring text
  const labelRing = document.getElementById('labelRing');
  const labels = ['NAV', 'PWR', 'AI', 'NET', 'SEC', 'SYS', 'CPU', 'MEM'];
  labels.forEach((label, i) => {
    const angle = (i * 45 - 90) * Math.PI / 180;
    const x = 210 + Math.cos(angle) * 135;
    const y = 210 + Math.sin(angle) * 135;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('class', 'label label-bright');
    text.textContent = label;
    labelRing.appendChild(text);
  });

  // Generate waveform bars
  const waveform = document.getElementById('waveform');
  for (let i = 0; i < 40; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    bar.style.animationDelay = `${i * 0.05}s`;
    bar.style.animationDuration = `${0.8 + Math.random() * 0.8}s`;
    waveform.appendChild(bar);
  }

  // Generate spark particles
  const sparks = document.getElementById('sparks');
  function createSpark() {
    const spark = document.createElement('div');
    spark.className = 'spark';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 120;
    spark.style.left = '50%';
    spark.style.top = '50%';
    spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    spark.style.animationDuration = `${1.5 + Math.random() * 2}s`;
    sparks.appendChild(spark);
    setTimeout(() => spark.remove(), 3500);
  }
  setInterval(createSpark, 200);

  // State control — parent drives via postMessage / ?state= / ?embed=1
  const params = new URLSearchParams(location.search);
  if (params.get('embed') === '1') document.body.classList.add('embed');

  const jarvis = document.getElementById('jarvis');
  const statusBadge = document.getElementById('statusBadge');
  const stateLabels = {
    idle: '◉ ONLINE',
    listening: '◉ LISTENING',
    speaking: '◉ SPEAKING',
    processing: '⟳ PROCESSING',
    thinking: '⟳ PROCESSING',
    offline: '◌ OFFLINE'
  };

  function normalizeState(next) {
    if (!next) return 'idle';
    const key = String(next).toLowerCase();
    if (key === 'thinking') return 'processing';
    if (stateLabels[key]) return key === 'thinking' ? 'processing' : key;
    return 'idle';
  }

  function setJarvisState(next) {
    const state = normalizeState(next);
    jarvis.className = `jarvis-core state-${state}`;
    document.body.classList.remove(
      'state-idle', 'state-listening', 'state-speaking',
      'state-processing', 'state-offline'
    );
    document.body.classList.add(`state-${state}`);
    statusBadge.textContent = stateLabels[state] || stateLabels.idle;
    document.querySelectorAll('.ctrl-btn').forEach(b => {
      const btnState = b.dataset.state;
      b.classList.toggle('active', btnState === state || (state === 'offline' && btnState === 'idle'));
    });
  }

  document.querySelectorAll('.ctrl-btn').forEach(btn => {
    btn.addEventListener('click', () => setJarvisState(btn.dataset.state));
  });

  // Click core to cycle states (disabled in embed — parent handles click)
  jarvis.addEventListener('click', () => {
    if (document.body.classList.contains('embed')) return;
    const states = ['idle', 'listening', 'speaking', 'processing'];
    const current = (jarvis.className.match(/state-(\w+)/) || [])[1] || 'idle';
    const next = states[(states.indexOf(current) + 1) % states.length];
    setJarvisState(next);
  });

  const initial = params.get('state');
  if (initial) setJarvisState(initial);

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'jarvis-state' && data.state != null) {
      setJarvisState(data.state);
    }
  });
</script>
</body>
</html>
